name: Automated Serverless CI/CD Pipeline

on:
  push:
    branches:
      - main # 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Metadata (Tags/Digests)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_USERNAME }}/random-project-git

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/random-project-git:latest # 👈 Always pushes the newest build here
      - name: Force OpenShift Serverless Rollout 🚀
        run: |
          curl -X PATCH "https://openshiftapps.com" \
          -H "User-Agent: GitHub-Actions-Rollout-Trigger" \
          --fail || true
