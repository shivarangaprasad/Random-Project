name: Automated Serverless CI/CD Pipeline

on:
  push:
    branches:
      - main # 👈 Triggers instantly on every commit to main

jobs:
  build-push-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/random-project-git:latest

      - name: Download & Install OpenShift CLI Tools 🛠️
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.14" # 👈 Installs the required 'oc' binary onto the runner environment

      - name: Log in to OpenShift Cluster
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: bharadwaj-siva-dev

      - name: Mutate Configuration & Force Rollout 🚀
        run: |
          oc patch ksvc random-project-git --type=merge -p '{"spec":{"template":{"metadata":{"annotations":{"client.knative.dev/nonce":"'${{ github.run_number }}'"}}}}}'
